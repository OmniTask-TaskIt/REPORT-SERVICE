spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
chat.service.url=${CHAT_SERVICE_URL:http://mschat.santiagosu15.cloud/}
cloud.aws.credentials.access-key=${vcloud.aws.credentials.access-key}
cloud.aws.credentials.secret-key=${vcloud.aws.credentials.secret-key}
cloud.aws.region.static=${vcloud.aws.region.static}
cloud.aws.credentials.session-token=${AWS_SESSION_TOKEN}
cloud.aws.s3.bucket-name=${AWS_BUCKET_NAME:taskit-files}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB